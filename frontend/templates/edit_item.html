{% extends 'layout.html' %}

{% block content %}
<div class="edit-form-card">
    <h2>Edit Device</h2>

    <form action="{{ url_for('edit_item', id=device['id']) }}" method="POST">
        <div class="form-grid">

            <div class="form-field">
                <label for="mac_address">MAC Address</label>
                <input type="text" id="mac_address" name="mac_address" value="{{ device['mac_address'] }}"{% if session.role != 'admin' %} readonly{% endif %}>
            </div>

            <div class="form-field">
                <label for="device_model">Device Model</label>
                <input type="text" id="device_model" name="device_model" value="{{ device['device_model'] }}"{% if session.role != 'admin' %} readonly{% endif %}>
            </div>

            <div class="form-field">
                <label for="owner">Owner</label>
                <input type="text" id="owner" name="owner" value="{{ device['owner'] }}"{% if session.role != 'admin' %} readonly{% endif %}>
            </div>

            <div class="form-field">
                <label for="availability">Availability</label>
                <select id="availability" name="availability">
                    <option value="Available" {% if device['availability'] == 'Available' %}selected{% endif %}>Available</option>
                    <option value="In Use" {% if device['availability'] == 'In Use' %}selected{% endif %}>In Use</option>
                </select>
            </div>

            <div class="form-field">
                <label for="reporting_manager">Reporting Manager</label>
                <input type="text" id="reporting_manager" name="reporting_manager" value="{{ device['reporting_manager'] }}">
            </div>

            <div class="form-field">
                <label for="team">Team</label>
                <input type="text" id="team" name="team" value="{{ device['team'] }}">
            </div>

            <div class="form-field">
                <label for="ip_address">IP Address</label>
                <input type="text" id="ip_address" name="ip_address" value="{{ device['ip_address'] }}">
            </div>

            <div class="form-field">
                <label for="location">Location</label>
                <input type="text" id="location" name="location" value="{{ device['location'] }}">
            </div>

            <div class="form-field">
                <label for="lease">Lease</label>
                <input type="text" id="lease" name="lease" value="{{ device['lease'] }}"{% if session.role != 'admin' %} readonly{% endif %}>
            </div>

            <div class="form-field">
                <label for="project">Project</label>
                <input type="text" id="project" name="project" value="{{ device['project'] or '' }}">
            </div>

            <div class="form-field">
                <label for="console">Console</label>
                <input type="text" id="console" name="console" value="{{ device['console'] or '' }}">
            </div>

            <div class="form-field">
                <label for="power">Power</label>
                <input type="text" id="power" name="power" value="{{ device['power'] or '' }}">
            </div>

            <div class="form-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" value="{{ device['decrypted_password'] }}" autocomplete="new-password">
            </div>

        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Save Changes</button>
            <a href="{{ url_for('inventory') }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    fetch('/api/autocomplete-options')
        .then(function(res) { return res.json(); })
        .then(function(data) {
            initAutocomplete(document.getElementById('owner'), data.owners || []);
            initAutocomplete(document.getElementById('reporting_manager'), data.reporting_managers || []);
            initAutocomplete(document.getElementById('device_model'), data.device_models || []);
            initAutocomplete(document.getElementById('team'), data.teams || []);
        })
        .catch(function() {});
});
</script>
{% endblock %}
