{% extends 'layout.html' %}

{% block content %}
<div class="edit-form-card">
    <h2>Reset Password</h2>
    <form method="POST" action="{{ url_for('reset_password', user_id=target_user.id) }}">
        <div class="form-grid">
            <div class="form-field">
                <label for="username_display">Username</label>
                <input type="text" id="username_display" value="{{ target_user.username }}" readonly>
            </div>
            <div class="form-field"></div>
            <div class="form-field">
                <label for="new_password">New Password</label>
                <input type="password" id="new_password" name="new_password" required>
            </div>
            <div class="form-field">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required>
            </div>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">Reset Password</button>
            <a href="{{ url_for('users') }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
