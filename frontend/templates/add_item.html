{% extends 'layout.html' %}

{% block content %}
<div class="edit-form-card">
    <h2>Add New Device</h2>

    <form method="POST" action="{{ url_for('add_item') }}">
        <div class="form-grid">

            <div class="form-field">
                <label for="mac_address">MAC Address</label>
                <input type="text" id="mac_address" name="mac_address" required>
            </div>

            <div class="form-field">
                <label for="device_model">Device Model</label>
                <input type="text" id="device_model" name="device_model" required>
            </div>

            <div class="form-field">
                <label for="owner">Owner</label>
                <input type="text" id="owner" name="owner" required>
            </div>

            <div class="form-field">
                <label for="availability">Availability</label>
                <select id="availability" name="availability" required>
                    <option value="Available">Available</option>
                    <option value="In Use">In Use</option>
                </select>
            </div>

            <div class="form-field">
                <label for="reporting_manager">Reporting Manager</label>
                <input type="text" id="reporting_manager" name="reporting_manager">
            </div>

            <div class="form-field">
                <label for="team">Team</label>
                <input type="text" id="team" name="team">
            </div>

            <div class="form-field">
                <label for="ip_address">IP Address</label>
                <input type="text" id="ip_address" name="ip_address">
            </div>

            <div class="form-field">
                <label for="location">Location</label>
                <input type="text" id="location" name="location">
            </div>

            <div class="form-field">
                <label for="lease">Lease</label>
                <input type="text" id="lease" name="lease">
            </div>

            <div class="form-field">
                <label for="project">Project</label>
                <input type="text" id="project" name="project">
            </div>

            <div class="form-field">
                <label for="console">Console</label>
                <input type="text" id="console" name="console">
            </div>

            <div class="form-field">
                <label for="power">Power</label>
                <input type="text" id="power" name="power">
            </div>

            <div class="form-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password">
            </div>

        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Add Device</button>
            <a href="{{ url_for('inventory') }}" class="btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    fetch('/api/autocomplete-options')
        .then(function(res) { return res.json(); })
        .then(function(data) {
            initAutocomplete(document.getElementById('owner'), data.owners || []);
            initAutocomplete(document.getElementById('reporting_manager'), data.reporting_managers || []);
            initAutocomplete(document.getElementById('device_model'), data.device_models || []);
            initAutocomplete(document.getElementById('team'), data.teams || []);
        })
        .catch(function() {});
});
</script>
{% endblock %}
